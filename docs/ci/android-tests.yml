name: Spider Radio Android tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build and emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'

      - name: Prepare JVM JSON and browser test dependencies
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar \
            --output "$RUNNER_TEMP/org-json.jar"
          npm ci
          npx playwright install --with-deps chromium
          echo "ORG_JSON_JAR=$RUNNER_TEMP/org-json.jar" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Build and sign temporary CI test APK
        run: |
          bash build.sh --unsigned
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-debug.jks" -alias ci \
            -storepass android -keypass android -dname 'CN=Spider Radio CI' -keyalg RSA -validity 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ci-debug.jks" --ks-pass pass:android \
            --out build/SpiderRadio-ci.apk build/SpiderRadio-0.8.3-unsigned.apk

      - name: Run host and UI regressions
        run: bash tests/run-host-regressions.sh

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 35 emulator startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/emulator-startup.sh emulator-5554 build/SpiderRadio-ci.apk build/device-reports/startup

      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-radio-v083-test-evidence
          path: |
            build/test-reports/
            build/device-reports/
            build/SpiderRadio-0.8.3-unsigned.apk
          if-no-files-found: ignore
          retention-days: 14
